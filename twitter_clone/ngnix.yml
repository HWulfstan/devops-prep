- hosts: all
  become: yes

  tasks:
    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Ensure nginx is enabled and running
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Copy nginx config
      copy:
        src: nginx.conf
        dest: /etc/nginx/nginx.conf

    - name: Restart nginx
      service:
        name: nginx
        state: restarted
